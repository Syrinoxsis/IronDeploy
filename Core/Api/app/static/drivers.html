<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/static/irondeploy-api-icon.png">
    <title>IronDeploy - Drivers</title>
    <link rel="stylesheet" href="/static/dashboard.css">
    <link rel="stylesheet" href="/static/navigation.css">
    <link rel="stylesheet" href="/static/drivers.css">
    <script src="/static/i18n.js"></script>
    <script src="/static/navigation.js"></script>
    <script src="/static/drivers.js" defer></script>
</head>
<body data-page="drivers">
    <header class="app-header">
        <div class="header-inner">
            <span class="header-page-title">Drivers</span>
            <div class="header-actions">
                <button class="refresh-button" id="refresh-button" type="button">
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M20 6v5h-5"></path>
                        <path d="M19 11a7.5 7.5 0 1 0 .1 3.4"></path>
                    </svg>
                    <span>Refresh</span>
                </button>
            </div>
        </div>
    </header>

    <main class="page-shell driver-page-shell">
        <section class="notice" id="message-area" hidden></section>

        <div class="driver-workspace">
            <aside class="vendor-rail" aria-label="Vendors">
                <form class="vendor-add" id="vendor-form">
                    <input id="vendor-name" class="driver-text-input" type="text"
                           maxlength="255" placeholder="New vendor" spellcheck="false">
                    <button class="icon-only-button" type="submit" title="Add vendor" aria-label="Add vendor">
                        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
                    </button>
                </form>
                <div class="vendor-list" id="vendor-list"></div>
            </aside>

            <div class="driver-main">
                <header class="selected-vendor-header">
                    <div class="selected-vendor-identity">
                        <h1 id="selected-vendor-name">No vendor selected</h1>
                        <span class="neutral-tag" id="package-count">0 packages</span>
                    </div>
                    <div class="selected-vendor-actions">
                        <button class="text-button" id="rename-vendor-button" type="button" disabled>
                            Rename vendor
                        </button>
                        <button class="text-button danger" id="delete-vendor-button" type="button" disabled>
                            Delete vendor
                        </button>
                    </div>
                </header>

                <section class="package-upload-panel" aria-label="Add a driver package">
                    <div class="package-upload-controls">
                        <select id="package-vendor" hidden aria-hidden="true" tabindex="-1">
                            <option value="">Select vendor</option>
                        </select>
                        <span class="accent-tag" id="package-vendor-label">Vendor</span>
                        <input id="package-model" class="driver-text-input package-model-input"
                               type="text" maxlength="255"
                               placeholder="Model name, e.g. Latitude 5540" spellcheck="false" disabled>
                        <label class="folder-picker">
                            <svg aria-hidden="true" viewBox="0 0 24 24">
                                <path d="M12 16V4"></path>
                                <path d="m6 10 6-6 6 6"></path>
                                <path d="M4 20h16"></path>
                            </svg>
                            <span>Choose folder</span>
                            <input id="package-folder" type="file" webkitdirectory directory multiple disabled>
                        </label>
                        <button class="primary-button" id="upload-button" type="button" disabled>Upload package</button>
                    </div>
                    <div class="upload-feedback">
                        <span class="folder-summary" id="folder-summary" hidden>No folder selected</span>
                        <div class="progress-row" id="upload-progress-row" hidden>
                            <progress id="upload-progress" max="100" value="0"></progress>
                            <span id="upload-progress-text">Preparing upload...</span>
                            <button class="cancel-button" id="cancel-upload-button" type="button">
                                Cancel upload
                            </button>
                        </div>
                    </div>
                </section>

                <section class="package-section" aria-label="Driver packages">
                    <p class="drivers-directory" id="drivers-directory" hidden></p>
                    <div class="driver-package-list" id="package-list"></div>
                    <div class="empty-state" id="empty-state" hidden>No driver packages were found.</div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
